<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Bang Thrower</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg: #020205;
            --ui-bg: rgba(10, 15, 30, 0.7);
            --ui-border: rgba(239, 68, 68, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw; height: 100vh;
        }

        canvas { display: block; position: absolute; z-index: 1; top: 0; left: 0; }

        #ui-layer {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 10; pointer-events: none; padding: 30px;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .glass-panel {
            background: var(--ui-bg); border: 1px solid var(--ui-border);
            padding: 12px 20px; border-radius: 12px; backdrop-filter: blur(10px);
            font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
        .bottom-bar { display: flex; justify-content: space-between; align-items: flex-end; }

        #cam-wrapper {
            width: 180px; height: 135px; border-radius: 12px; overflow: hidden;
            border: 1px solid var(--ui-border); box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
        }
        #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        #init-screen {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(2, 2, 5, 0.95); z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease; pointer-events: auto; backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 3rem; margin-bottom: 10px;
            background: linear-gradient(90deg, #fde047, #ef4444);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-align: center; letter-spacing: 4px;
        }
        p.subtitle { color: #ef4444; margin-bottom: 40px; letter-spacing: 2px; }

        button {
            padding: 16px 48px; background: rgba(10, 15, 30, 0.8);
            border: 2px solid #ef4444; color: #ef4444; font-size: 1.1rem;
            border-radius: 50px; cursor: pointer; transition: all 0.3s ease;
            text-transform: uppercase; letter-spacing: 2px; font-weight: bold;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.3); pointer-events: auto;
        }

        button:hover {
            background: rgba(239, 68, 68, 0.2); box-shadow: 0 0 40px rgba(239, 68, 68, 0.8);
            transform: translateY(-3px) scale(1.05); color: #fff;
        }

        /* Screen Flash for Big Bang */
        #flash {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: white; z-index: 50; opacity: 0; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="flash"></div>
    <canvas id="mainCanvas"></canvas>

    <div id="ui-layer">
        <div class="top-bar">
            <div class="glass-panel">
                <span style="color: #ef4444">WEAPON //</span> THE SUN<br>
                <span style="font-size: 0.7rem; color: #94a3b8; display: block; margin-top: 5px;">
                    FIST: Grab & Hold | PALM: Throw
                </span>
            </div>
            <div class="glass-panel" style="text-align: right;">
                BIG BANGS: <span id="bang-count" style="color: #ef4444">0</span>
            </div>
        </div>
        
        <div class="bottom-bar">
            <div class="glass-panel" id="status-panel" style="color: #fde047; font-weight: bold;">
                WAITING FOR HAND...
            </div>
            <div id="cam-wrapper">
                <video id="webcam" autoplay playsinline></video>
            </div>
        </div>
    </div>

    <div id="init-screen">
        <h1>THE BIG BANG</h1>
        <p class="subtitle">Throw the sun. Destroy the universe.</p>
        <button id="start-btn">Start Simulation</button>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const flashOverlay = document.getElementById('flash');
        
        let width = window.innerWidth;
        let height = window.innerHeight;
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;

        /** --- AUDIO SYNTHESIS --- */
        const Audio = {
            ctx: null,
            init() {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
            },
            playBigBang() {
                if(!this.ctx) return;
                const now = this.ctx.currentTime;
                
                // Cinematic Bass Drop
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(10, now + 2);
                gain.gain.setValueAtTime(1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 3);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(now); osc.stop(now + 3);

                // White Noise Explosion Crunch
                const bufferSize = this.ctx.sampleRate * 2; // 2 seconds
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const noiseFilter = this.ctx.createBiquadFilter();
                noiseFilter.type = 'lowpass';
                noiseFilter.frequency.setValueAtTime(2000, now);
                noiseFilter.frequency.exponentialRampToValueAtTime(50, now + 1.5);
                
                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(0.8, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 2);
                
                noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(this.ctx.destination);
                noise.start(now);
            }
        };

        /** --- PHYSICS ENTITIES --- */
        let gameActive = true;
        let screenShake = 0;
        let bangCount = 0;

        // Player Planet (The Sun)
        const player = {
            x: width/2, y: height/2, vx: 0, vy: 0, radius: 40,
            state: 'idle', // idle, held, thrown
            history: []    // Tracks positions to calculate throw velocity
        };

        // Target Planets
        let targets = [];
        const colors = ['#38bdf8', '#a855f7', '#10b981', '#f43f5e', '#64748b'];

        function spawnTargets() {
            targets = [];
            for(let i=0; i<8; i++) {
                targets.push({
                    x: Math.random() * width, y: Math.random() * height,
                    vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2,
                    radius: Math.random() * 25 + 15,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }
        }
        spawnTargets();

        // Explosion Particles
        let particles = [];
        let shockwaves = [];
        let stars = Array.from({length: 150}, () => ({
            x: Math.random()*width, y: Math.random()*height, 
            r: Math.random()*1.5, alpha: Math.random()
        }));

        /** --- BIG BANG EVENT --- */
        function triggerBigBang(x, y) {
            gameActive = false; // Pause normal logic
            bangCount++;
            document.getElementById('bang-count').innerText = bangCount;
            document.getElementById('status-panel').innerText = "UNIVERSAL REBOOT...";
            document.getElementById('status-panel').style.color = "#fff";

            // Audio & Screen Flash
            Audio.playBigBang();
            flashOverlay.style.transition = 'none';
            flashOverlay.style.opacity = '1';
            setTimeout(() => {
                flashOverlay.style.transition = 'opacity 2s ease-out';
                flashOverlay.style.opacity = '0';
            }, 50);

            screenShake = 50; // Intense camera shake

            // Spawn massive shockwaves
            shockwaves.push({x, y, r: 10, dr: 30, alpha: 1});
            shockwaves.push({x, y, r: 10, dr: 15, alpha: 1});

            // Spawn 300 debris particles
            particles = [];
            for(let i=0; i<300; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 25 + 5;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                    r: Math.random() * 4 + 1,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 1
                });
            }

            // Hide planets instantly
            targets = [];
            player.state = 'hidden';

            // Reset universe after 3 seconds
            setTimeout(() => {
                spawnTargets();
                player.state = 'idle';
                player.x = width/2; player.y = height/2;
                player.vx = 0; player.vy = 0;
                gameActive = true;
                document.getElementById('status-panel').innerText = "SYSTEM RESTORED";
                document.getElementById('status-panel').style.color = "#fde047";
            }, 3000);
        }

        /** --- HAND / MOUSE INPUT --- */
        let input = { x: width/2, y: height/2, active: false }; // active = FIST or CLICK

        function handleInput() {
            if(!gameActive) return;

            // Track position history for throwing physics
            player.history.push({x: input.x, y: input.y});
            if(player.history.length > 5) player.history.shift(); // Keep last 5 frames

            if(input.active) {
                // HOLDING
                player.state = 'held';
                // Move sun smoothly to hand
                player.x += (input.x - player.x) * 0.4;
                player.y += (input.y - player.y) * 0.4;
                document.getElementById('status-panel').innerText = "SUN GRABBED (READY TO THROW)";
                document.getElementById('status-panel').style.color = "#f97316";
            } 
            else if (player.state === 'held' && !input.active) {
                // THROW EVENT (Triggered on release)
                player.state = 'thrown';
                // Calculate velocity from history (Delta X/Y of oldest vs newest frame)
                let old = player.history[0];
                let vx = (input.x - old.x) * 0.5; // Throw multiplier
                let vy = (input.y - old.y) * 0.5;
                
                // Cap speed so it doesn't break physics
                let speed = Math.sqrt(vx*vx + vy*vy);
                if(speed > 40) { vx = (vx/speed)*40; vy = (vy/speed)*40; }
                
                player.vx = vx;
                player.vy = vy;
                
                document.getElementById('status-panel').innerText = "PROJECTILE LAUNCHED!";
                document.getElementById('status-panel').style.color = "#ef4444";
            }
        }

        /** --- RENDER LOOP --- */
        function drawSun(x, y) {
            let time = performance.now() * 0.005;
            let pulse = 40 + Math.sin(time) * 5;
            
            ctx.beginPath();
            ctx.arc(x, y, pulse, 0, Math.PI*2);
            ctx.fillStyle = '#fde047';
            ctx.shadowBlur = 60; ctx.shadowColor = '#f97316';
            ctx.fill(); ctx.shadowBlur = 0;
            
            // Core
            ctx.beginPath();
            ctx.arc(x, y, 30, 0, Math.PI*2);
            ctx.fillStyle = '#fff';
            ctx.fill();
        }

        function animate() {
            // Apply Screen Shake
            ctx.save();
            if(screenShake > 0) {
                let dx = (Math.random()-0.5) * screenShake;
                let dy = (Math.random()-0.5) * screenShake;
                ctx.translate(dx, dy);
                screenShake *= 0.9; // decay
                if(screenShake < 0.5) screenShake = 0;
            }

            // Draw Space
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(2, 2, 5, 0.4)'; 
            ctx.fillRect(-50, -50, width+100, height+100);

            ctx.globalCompositeOperation = 'lighter';
            
            // Draw Stars
            ctx.fillStyle = '#fff';
            stars.forEach(s => {
                s.alpha += 0.05;
                ctx.globalAlpha = Math.abs(Math.sin(s.alpha));
                ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1;

            if(gameActive) {
                handleInput();

                // Update & Draw Targets
                targets.forEach(t => {
                    t.x += t.vx; t.y += t.vy;
                    if(t.x < -50) t.x = width+50; else if (t.x > width+50) t.x = -50;
                    if(t.y < -50) t.y = height+50; else if (t.y > height+50) t.y = -50;
                    
                    let grad = ctx.createRadialGradient(t.x-t.radius*0.3, t.y-t.radius*0.3, 0, t.x, t.y, t.radius);
                    grad.addColorStop(0, '#fff'); grad.addColorStop(0.5, t.color); grad.addColorStop(1, '#000');
                    
                    ctx.beginPath(); ctx.arc(t.x, t.y, t.radius, 0, Math.PI*2);
                    ctx.fillStyle = grad; ctx.fill();
                });

                // Update & Draw Player Sun
                if (player.state === 'thrown') {
                    player.x += player.vx;
                    player.y += player.vy;
                    // Wall Bounce
                    if(player.x < 0 || player.x > width) player.vx *= -1;
                    if(player.y < 0 || player.y > height) player.vy *= -1;

                    // Collision Detection!
                    for(let i=0; i<targets.length; i++) {
                        let t = targets[i];
                        let dx = player.x - t.x;
                        let dy = player.y - t.y;
                        let dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < player.radius + t.radius) {
                            // HIT!
                            triggerBigBang((player.x + t.x)/2, (player.y + t.y)/2);
                            break;
                        }
                    }
                } else if (player.state === 'idle') {
                    // Gentle float when not interacting
                    player.x += Math.sin(performance.now()*0.001) * 0.5;
                    player.y += Math.cos(performance.now()*0.001) * 0.5;
                }

                if(player.state !== 'hidden') drawSun(player.x, player.y);
            }

            // Draw Explosion Particles & Shockwaves
            particles.forEach((p, index) => {
                p.x += p.vx; p.y += p.vy;
                p.vx *= 0.95; p.vy *= 0.95; // Friction
                p.life -= 0.01;
                if(p.life <= 0) particles.splice(index, 1);
                else {
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${p.life})`;
                    ctx.shadowBlur = 10; ctx.shadowColor = p.color;
                    ctx.fill(); ctx.shadowBlur = 0;
                }
            });

            shockwaves.forEach((sw, index) => {
                ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI*2);
                ctx.strokeStyle = `rgba(255, 255, 255, ${sw.alpha})`;
                ctx.lineWidth = 15 * sw.alpha; ctx.stroke();
                sw.r += sw.dr; sw.alpha -= 0.02;
                if(sw.alpha <= 0) shockwaves.splice(index, 1);
            });

            ctx.restore(); // Restore from screen shake
            requestAnimationFrame(animate);
        }

        /** --- AI HAND TRACKING --- */
        const videoElement = document.getElementById('webcam');
        function onHandResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const lm = results.multiHandLandmarks[0];
                input.x += ((1 - lm[9].x) * width - input.x) * 0.3; 
                input.y += (lm[9].y * height - input.y) * 0.3;

                // Check Fist (Distance from wrist to fingertips)
                const wrist = lm[0];
                const fingers = [lm[8], lm[12], lm[16], lm[20]]; 
                let dist = 0;
                fingers.forEach(f => dist += Math.sqrt(Math.pow(f.x - wrist.x, 2) + Math.pow(f.y - wrist.y, 2)));
                dist /= 4;

                input.active = (dist < 0.25); // True = Fist (Grab), False = Palm (Throw)
            } else {
                if(!mouseHover) input.active = false;
            }
        }

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
        hands.onResults(onHandResults);

        /** --- FALLBACK MOUSE CONTROLS --- */
        let mouseHover = false;
        window.addEventListener('mousemove', (e) => {
            mouseHover = true;
            input.x += (e.clientX - input.x) * 0.5;
            input.y += (e.clientY - input.y) * 0.5;
            clearTimeout(window.mouseTimer);
            window.mouseTimer = setTimeout(() => mouseHover = false, 200);
        });
        window.addEventListener('mousedown', () => input.active = true);
        window.addEventListener('mouseup', () => input.active = false);
        window.addEventListener('touchstart', (e) => { input.x = e.touches[0].clientX; input.y = e.touches[0].clientY; input.active = true; });
        window.addEventListener('touchend', () => input.active = false);

        /** --- BOOT --- */
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('init-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('init-screen').style.display = 'none', 500);
            
            Audio.init();
            
            const camera = new Camera(videoElement, {
                onFrame: async () => { await hands.send({image: videoElement}); },
                width: 320, height: 240
            });
            camera.start();

            animate();
        });
    </script>
</body>
</html>
